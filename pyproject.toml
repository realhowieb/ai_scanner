[project]
name = "ai-scanner"
version = "0.2.0"
description = "AI-powered stock market scanner: API, scheduled scans and PostgreSQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.23",
    "yfinance>=0.2.27",
    "pytz>=2025.2",
    "requests",
    "lxml",
    "html5lib",
    "beautifulsoup4",
    "SQLAlchemy>=2.0",
    "bcrypt",
    "psycopg[binary]>=3.2"
]

[project.optional-dependencies]
ml = [
    "xgboost",
    "scikit-learn",
    "joblib"
]
extended = [
    "alpaca-py"
]
billing = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "uvicorn[standard]==0.32.1",
    "stripe==11.1.1",
    "psycopg2-binary==2.9.10"
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "assets",
    "observability",
    "auth",
    "billing_service",
    "data",
    "domain",
    "services",
    "db",
    "jobs",
    "scan",
    "scheduler",
    "ui",
    "utils"
]
py-modules = [
    "config",
    "logger",
    "market_data",
    "ml_prebreakout",
    "telemetry"
]

[tool.pytest.ini_options]
# A bare `pytest` collects only this repo's tests/, never a nested checkout or copy
# (e.g. an untracked ai_scanner/ folder), whose same-named test modules otherwise
# fail collection with "import file mismatch".
testpaths = ["tests"]
norecursedirs = [".*", "node_modules", "venv", ".venv", "build", "dist", "ai_scanner"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
# Syntax errors, undefined names, unused imports, import order, likely bugs (bugbear)
# and pylint's error class. CI runs a bare `ruff check .` with this set.
select = ["E9", "F", "I", "B", "PLE"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() defaults
    "B904",  # raise without `from` inside except
    "B905",  # zip() without strict=
    "B023",  # closures over loop variables that are called inside the same iteration
    "B007",  # unused loop variables in tuple unpacking
    "B017",  # assertRaises(Exception) in the Postgres constraint tests
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # re-exports
