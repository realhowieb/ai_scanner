name: PreBreakout Weekly Check

# Read-only. Measures how the PreBreakout picks users saw actually played out:
# top-10 (the Scanner's PreBreakout tab) hit rate against the average, AUC and
# calibration, on picks old enough for the outcome to be known (10+ days).
# Reads saved scans and stored candidates; writes nothing. The headline table is
# in the job summary; the full report is at the end of the log.

on:
  schedule:
    - cron: "30 14 * * 1"  # Mondays 14:30 UTC (before the US open)
  workflow_dispatch:
    inputs:
      days_back:
        description: "Lookback days"
        type: string
        default: "75"

concurrency:
  group: prebreakout-weekly-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-core.txt pyarrow -c requirements.lock
      - name: Run PreBreakout check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_SCANNER_SQLITE_FALLBACK: "false"
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
          AUDIT_DAYS_BACK: ${{ inputs.days_back || '75' }}
        run: python scripts/diag_prebreakout_live_audit.py
