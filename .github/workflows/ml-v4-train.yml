name: ML v4 Train & Evaluate

# Manual only. Preflight, training and development evaluation read production only.
# Explicit final_holdout=true writes the durable final-test ledger; register=true
# also publishes candidate artifacts and writes the model registry.
#   mode=train    (Milestone 2) trains XGBoost, LightGBM and CatBoost on an
# existing finalized research dataset version (SELECT only), for the
# pre-declared target "+4% before -2% within 5 trading days", stopping before
# the reserved holdout. Writes nothing to the database and never touches
# production AI Confidence or PreBreakout. Model files + manifest are uploaded
# as this run's artifact (30 days).
#   mode=evaluate (Milestone 3) walk-forward evaluation + calibration of every
# model on identical rows, the final holdout withheld by default, head-to-head with AI
# Confidence as served, and secondary targets by horizon. Reports only.
#   register=true (Milestone 4, mode=train only, requires final_holdout=true):
# a separate job uploads the model files to a new GitHub Release
# (ml-v4-models-<run id>, never overwriting) and inserts one "candidate" row per
# model into the ML v4 registry tables (ml_models / ml_model_events), with the
# walk-forward evaluation of the same run stored on each row. It never
# promotes a model and never touches production AI Confidence or PreBreakout.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "preflight (check only), train (save models), evaluate (development reports; final test requires explicit opt-in)"
        required: true
        default: "preflight"
        type: choice
        options:
          - preflight
          - evaluate
          - train
      dataset_version:
        description: "Finalized research dataset version (blank = newest)"
        required: false
        default: ""
      providers:
        description: "Comma-separated providers"
        required: true
        default: "xgboost,lightgbm,catboost"
      feature_sets:
        description: "Comma-separated feature sets"
        required: true
        default: "production,leakage_safe"
      cost_bps:
        description: "Round-trip cost in basis points for the returns table (evaluate)"
        required: true
        default: "20"
      register:
        description: "mode=train only: upload model files to a GitHub Release and register them as candidates (database write)"
        required: false
        default: false
        type: boolean
      final_holdout:
        description: "Explicit final test: writes a durable database claim; completed identical reports are reused and interrupted tests cannot automatically retry"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ml-v4
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements-core.txt
            requirements-ml.txt
            requirements-ml-v4.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-core.txt -r requirements-ml-v4.txt -c requirements.lock
      - name: Prepare and run (final-test ledger writes only with explicit opt-in)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_SCANNER_SQLITE_FALLBACK: "false"
          ML_V4_DATASET_VERSION: ${{ inputs.dataset_version }}
          ML_V4_PROVIDERS: ${{ inputs.providers }}
          ML_V4_FEATURE_SETS: ${{ inputs.feature_sets }}
          ML_V4_COST_BPS: ${{ inputs.cost_bps }}
          # SPY daily closes for the regime breakdown (evaluate); optional.
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
          MODE: ${{ inputs.mode }}
          REGISTER: ${{ inputs.register }}
          ML_V4_FINAL_HOLDOUT: ${{ inputs.final_holdout }}
        run: |
          if [ "$REGISTER" = "true" ] && [ "$MODE" != "train" ]; then
            echo 'Registration is only available in train mode.'
            exit 1
          fi
          if [ "$REGISTER" = "true" ] && [ "$ML_V4_FINAL_HOLDOUT" != "true" ]; then
            echo 'Registration requires an explicitly requested final holdout evaluation.'
            exit 1
          fi
          if [ "$ML_V4_FINAL_HOLDOUT" = "true" ] && [ "$MODE" = "preflight" ]; then
            echo 'Preflight never evaluates the final holdout.'
            exit 1
          fi
          # Resolve newest once so training and evaluation cannot select different versions.
          ML_V4_DATASET_VERSION="$(python -c 'import os; from scripts.ml_v4_train import _pick_version; print(_pick_version(os.getenv("ML_V4_DATASET_VERSION") or None)["dataset_version"])')"
          export ML_V4_DATASET_VERSION
          if [ "$MODE" = "preflight" ]; then
            python scripts/ml_v4_train.py --preflight-only --out "$RUNNER_TEMP/ml_v4"
            exit 0
          fi
          if [ "$MODE" = "train" ]; then
            python scripts/ml_v4_train.py --out "$RUNNER_TEMP/ml_v4"
            if [ "$REGISTER" = "true" ] || [ "$ML_V4_FINAL_HOLDOUT" = "true" ]; then
              # Evaluation evidence stored with each candidate (needed before "validated").
              python scripts/ml_v4_evaluate.py --out "$RUNNER_TEMP/ml_v4/evaluation"
              cat "$RUNNER_TEMP/ml_v4/evaluation/ml_v4_evaluation.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            python scripts/ml_v4_evaluate.py --out "$RUNNER_TEMP/ml_v4"
            cat "$RUNNER_TEMP/ml_v4/ml_v4_evaluation.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preparation report (including blocked runs)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/ml_v4/ml_v4_preflight.md" ]; then
            cat "$RUNNER_TEMP/ml_v4/ml_v4_preflight.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload models / reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ml-v4-${{ inputs.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ml_v4
          retention-days: 30
          if-no-files-found: warn

  register:
    # Opt-in database write: candidates only. Needs contents: write for the Release.
    needs: train
    if: ${{ inputs.mode == 'train' && inputs.register && needs.train.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-core.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-core.txt -c requirements.lock
      - uses: actions/download-artifact@v8
        with:
          name: ml-v4-train-${{ github.run_id }}
          path: ${{ runner.temp }}/ml_v4
      - name: Check files (dry run)
        run: python scripts/ml_v4_register.py --dir "$RUNNER_TEMP/ml_v4" --dry-run
      - name: Upload model files to a new GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ml-v4-models-${{ github.run_id }}
        run: |
          cd "$RUNNER_TEMP/ml_v4"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "ML v4 candidate models (run $GITHUB_RUN_ID)" \
            --notes "Candidate models from ML v4 training run $GITHUB_RUN_ID. Not used by production scoring." \
            ./*.joblib ./*.json
      - name: Register candidates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_SCANNER_SQLITE_FALLBACK: "false"
          ML_V4_RELEASE_TAG: ml-v4-models-${{ github.run_id }}
          ML_V4_ACTOR: ${{ github.actor }}
        run: python scripts/ml_v4_register.py --dir "$RUNNER_TEMP/ml_v4" --evaluation "$RUNNER_TEMP/ml_v4/evaluation/ml_v4_evaluation.json"
