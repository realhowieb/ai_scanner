name: Check Signal Outcomes

# Read-only health check: is the signal_outcomes pipeline freezing signals and
# backfilling their forward outcomes? Prints counts + the scorecard. No writes.
on:
  workflow_dispatch:

env:
  DB_TRAFFIC_WARN_BYTES: ${{ vars.DB_TRAFFIC_WARN_BYTES || '100000000' }}
  DB_TRAFFIC_WARN_UPLOAD_BYTES: ${{ vars.DB_TRAFFIC_WARN_UPLOAD_BYTES || '100000000' }}
  DB_TRAFFIC_WARN_CALLS: ${{ vars.DB_TRAFFIC_WARN_CALLS || '10000' }}
  DB_QUERY_WARN_MS: ${{ vars.DB_QUERY_WARN_MS || '2000' }}
  DB_JOB_WARN_MS: ${{ vars.DB_JOB_WARN_MS || '900000' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
      AI_SCANNER_SQLITE_FALLBACK: "false"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-core.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-core.txt -c requirements.lock

      - name: Check Neon connection secret
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL or DATABASE_URL GitHub Actions secret is required."
            exit 1
          fi

      - name: Report signal_outcomes health
        run: python -m scripts.db_traffic_job scripts.check_signal_outcomes

      - name: Upload aggregate database traffic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db-traffic-${{ github.job }}
          path: artifacts/db_traffic/*.json
          retention-days: 14
          if-no-files-found: ignore
