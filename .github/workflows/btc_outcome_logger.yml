name: BTC 15m Outcome Logger

# Collects training data for the 15-minute Kalshi BTC model (#9): logs the
# current window's decision-engine features + prediction, and settles past
# windows against Kalshi's ground-truth result. No-auth data sources (Coinbase,
# Kalshi) — only needs the Neon DATABASE_URL.
#
# Runs every 15 minutes to match the contract cadence, dispatched on the minute
# by cron-job.org. No GitHub `schedule:` trigger (removed 2026-10-01): it fired
# minutes late and duplicated the dispatched runs. To pause, disable the
# cron-job.org job (or turn the workflow off in the Actions tab) — the cron
# runner also calls the logger best-effort, so some data still trickles in.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [btc_outcome_logger]

concurrency:
  group: btc-outcome-logger
  cancel-in-progress: false

env:
  DB_TRAFFIC_WARN_BYTES: ${{ vars.DB_TRAFFIC_WARN_BYTES || '100000000' }}
  DB_TRAFFIC_WARN_UPLOAD_BYTES: ${{ vars.DB_TRAFFIC_WARN_UPLOAD_BYTES || '100000000' }}
  DB_TRAFFIC_WARN_CALLS: ${{ vars.DB_TRAFFIC_WARN_CALLS || '10000' }}
  DB_QUERY_WARN_MS: ${{ vars.DB_QUERY_WARN_MS || '2000' }}
  DB_JOB_WARN_MS: ${{ vars.DB_JOB_WARN_MS || '900000' }}

permissions:
  contents: read

jobs:
  log:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-core.txt -c requirements.lock
      - name: Log + settle 15m BTC outcomes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_SCANNER_SQLITE_FALLBACK: "false"
        run: python -m scripts.db_traffic_job analytics.btc_outcome_logger

      - name: Upload aggregate database traffic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db-traffic-${{ github.job }}
          path: artifacts/db_traffic/*.json
          retention-days: 14
          if-no-files-found: ignore
