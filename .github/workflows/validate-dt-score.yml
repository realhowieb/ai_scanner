name: Validate DT Score

# Direction-aware backtest of the Day Trader DT Score against real historical
# intraday bars (Run 33). Runs in the cloud with the same Alpaca secrets the
# scheduled scans use — no local setup. Uploads the report as an artifact.
# Read-only: modifies no production state and changes no scoring.

on:
  schedule:
    # Weekly, Saturday 11:00 UTC — accumulate multi-regime samples for the
    # DT Score recalibration gate (docs/DT_SCORE_RECALIBRATION.md).
    - cron: "0 11 * * 6"
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated tickers (blank = broad default set)"
        type: string
        default: ""
      start:
        description: "Start date (YYYY-MM-DD, blank = trailing 30 days)"
        type: string
        default: ""
      end:
        description: "End date (YYYY-MM-DD, optional)"
        type: string
        default: ""
      sample_every:
        description: "Sample a signal every N minute-bars"
        type: string
        default: "15"

concurrency:
  group: validate-dt-score
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-core.txt -c requirements.lock
          python -m pip install --prefer-binary -r requirements-ml.txt -c requirements.lock

      - name: Run DT Score validation
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
          ALPACA_FEED: ${{ secrets.ALPACA_FEED }}
          IN_SYMBOLS: ${{ inputs.symbols }}
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
          IN_SAMPLE_EVERY: ${{ inputs.sample_every }}
        run: |
          # Broad, multi-sector default set (large/small cap, high/low vol) so
          # scheduled runs accumulate a regime-diverse sample.
          DEFAULT_SYMBOLS="NVDA,AMD,INTC,MU,AVGO,SMCI,TSLA,AAPL,MSFT,AMZN,META,GOOGL,NFLX,PLTR,SOFI,COIN,MARA,DELL,CRWD,SNOW,UBER,XOM,CVX,JPM,BAC,PFE,KO,WMT,F,RIVN"
          export DTV_SYMBOLS="${IN_SYMBOLS:-$DEFAULT_SYMBOLS}"
          export DTV_START="${IN_START:-$(date -u -d '30 days ago' +%F)}"
          export DTV_END="${IN_END:-}"
          export DTV_SAMPLE_EVERY="${IN_SAMPLE_EVERY:-15}"
          echo "Window: $DTV_START -> ${DTV_END:-now} | symbols: $(echo "$DTV_SYMBOLS" | tr ',' '\n' | wc -l)"
          python -m scripts.validate_day_trade_score --out artifacts
          echo "### DT Score validation" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sed -n '1,40p' artifacts/day_trader_validation.md >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if test -f artifacts/dt_tier_diagnostic.md; then
            echo '### Rejected v2 tier diagnostic' >> "$GITHUB_STEP_SUMMARY"
            sed -n '1,35p' artifacts/dt_tier_diagnostic.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dt-score-validation
          path: |
            artifacts/day_trader_validation.json
            artifacts/day_trader_validation.md
            artifacts/dt_tier_diagnostic.json
            artifacts/dt_tier_diagnostic.md
            artifacts/dt_parity_records.jsonl
            artifacts/dt_tier_diagnostic.json
            artifacts/dt_tier_diagnostic.md
