name: Scheduled Market Scans

on:
  # Manual trigger (Actions tab) or external scheduler (e.g. Render cron) via the
  # API. `force` defaults true so a hand-run bypasses the weekend/premarket skip,
  # the alert cooldown, and the earnings throttle for on-demand testing. A
  # reliable external scheduler should pass force=false so runs behave like real
  # scheduled runs (throttled alerts, once-daily earnings).
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass weekend/throttle (manual testing). Set false for scheduled use."
        type: boolean
        default: true
      session:
        description: "Scan session. 'auto' infers from ET time (premarket <9:30, postmarket >=16:00)."
        type: choice
        options: [auto, regular, premarket, postmarket]
        default: auto

  # No GitHub `schedule:` trigger (removed 2026-09-29). cron-job.org is the only
  # scheduler: it dispatches this workflow on main (force=false, session=auto)
  # at 12:35, 13:35, 16:35, 19:35, 20:35 and 21:35 UTC on weekdays. GitHub's own
  # cron fired hours late (e.g. the 21:10 UTC slot at 00:27 UTC) and duplicated
  # those slots; a late run after UTC midnight sent the morning digest at night.

permissions:
  contents: read

jobs:
  run-scans:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Match the Streamlit Cloud runtime and the requirements.lock platform
          # so the cron runs the exact same dependency stack as the app.
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-core.txt -c requirements.lock
          # ML group (xgboost/scikit-learn/joblib) so the cron can load the
          # PreBreakout / AI-Confidence models and actually score candidates —
          # required for the track-record ranking A/B to be meaningful.
          python -m pip install --prefer-binary -r requirements-ml.txt -c requirements.lock

      # Runners are ephemeral, so state the scanner keeps on disk between runs is
      # restored from / saved to the Actions cache: the US_MARKET last-known-good
      # universe (the fallback when Alpaca's asset list is down; without it a
      # provider outage aborts the scan) and the rolling perf history (last 60
      # runs). Keys are unique per run; restore-keys picks the newest saved state.
      - name: Restore scanner state
        uses: actions/cache/restore@v6
        with:
          path: |
            artifacts/universe/us_market.json
            artifacts/automation/perf_history.jsonl
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scanner-state-

      - name: Run scheduled scans
        env:
          # 🔑 Add these in GitHub → Settings → Secrets and variables → Actions
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_SCANNER_SQLITE_FALLBACK: "false"
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
          # SMTP (Resend) so the alert evaluator can email users from the cron.
          # These are a SEPARATE secret store from Streamlit Cloud — set them in
          # GitHub → Settings → Secrets and variables → Actions.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          # Optional error monitoring (no-op unless set).
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Earnings calendar sources (FMP primary, Finnhub fallback).
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Pre-open morning digest (Pro+). Off unless the secret is set to "1".
          # Sent once/day on the first scan run; a forced manual run re-sends.
          MORNING_DIGEST_ENABLED: ${{ secrets.MORNING_DIGEST_ENABLED }}
          MORNING_DIGEST_MAX_USERS: ${{ secrets.MORNING_DIGEST_MAX_USERS }}
          CRON_SUMMARY_PATH: artifacts/scheduled_scan_summary.json
          # Skip the slow per-symbol yfinance fallback for symbols Alpaca doesn't
          # carry (micro-caps/warrants that never pass filters) — big speedup.
          PRICE_SKIP_YF_FALLBACK: "1"
          # Share downloaded bars across the three universe scans in one run
          # (COMBO largely repeats SP500+NASDAQ; default 60s TTL expired between
          # scans and forced a full re-download).
          PRICE_CACHE_TTL_SECONDS: "3600"
          # Manual "Run workflow" forces a run (bypasses weekend/premarket skip);
          # scheduled runs respect the skip.
          CRON_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
          # Session routing: 'auto' lets cron_runner infer premarket/regular/
          # postmarket from ET time, so one external cron job covers all slots.
          CRON_SESSION: ${{ inputs.session || 'auto' }}
          # Scan the FULL Nasdaq list (nasdaq.txt has ~4,428 symbols) instead of
          # the code default of 2,000. A value above the file length covers every
          # symbol; the price cache above keeps the added COMBO overlap cheap.
          CRON_NASDAQ_LIMIT: "10000"
          AUTOMATION_HISTORY_DAYS: "30"
          # Manual runs also bypass the per-alert cooldown so alerts can be
          # tested on demand; scheduled runs keep the normal 12h throttle.
          ALERT_THROTTLE_HOURS: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '0' || '12' }}
        run: python -m scheduler.cron_runner

      # Saved even when the scan fails, so the perf history keeps the failed run.
      # The universe file is only rewritten on a successful live fetch, so a
      # failing run re-saves the previous good list, never a bad one.
      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            artifacts/universe/us_market.json
            artifacts/automation/perf_history.jsonl
          key: scanner-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload scheduled scan summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-scan-summary
          path: artifacts/scheduled_scan_summary.json
          if-no-files-found: warn

      - name: Upload scanner automation snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scanner-automation-snapshot
          path: |
            artifacts/automation/latest_scan.json
            artifacts/automation/status.json
            artifacts/automation/coverage_*.json
            artifacts/automation/perf_history.jsonl
            artifacts/automation/history/**/*.json
          if-no-files-found: warn
