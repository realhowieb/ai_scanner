name: ML Development Feature Quality
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install research dependencies
        run: python -m pip install --prefer-binary -r requirements-core.txt -r requirements-ml-v4.txt -c requirements.lock
      - name: Audit the original development slice only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_SCANNER_SQLITE_FALLBACK: 'false'
        run: python scripts/ml_development_quality.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ml-development-quality-${{ github.run_id }}
          path: artifacts/ml_development_quality
          retention-days: 90
          if-no-files-found: ignore
