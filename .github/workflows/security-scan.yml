name: Security Scan

# Repo-wide security scanners. Runs on every push/PR to dev and main and daily,
# so a newly published CVE or a leaked secret is caught the day it appears, not
# on the next unrelated push.
#
#   secrets       gitleaks over the full git history (.gitleaksignore = reviewed
#                 false positives)
#   code          Bandit, medium+ severity and confidence, against the reviewed
#                 baseline .github/bandit-baseline.json (only NEW findings fail)
#   workflows     actionlint + zizmor (.github/zizmor.yml)
#   dependencies  pip-audit on requirements.lock and the billing service pins
#
# The personal-email and pin-parity guards live in tests/test_repo_hygiene.py
# (run by Smoke Checks).
on:
  push:
    branches: [dev, main]
  pull_request:
  schedule:
    - cron: "0 10 * * *"   # daily, before the US open
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        env:
          VERSION: "8.30.1"
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan full history for secrets
        run: ./gitleaks git . --redact --no-banner --exit-code 1

  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Bandit (new medium+ findings fail)
        run: |
          python -m pip install --upgrade pip "bandit==1.9.4"
          bandit -r . -x ./tests,./.venv -ll -ii -b .github/bandit-baseline.json

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install actionlint (pinned, checksum-verified)
        env:
          VERSION: "1.7.12"
          SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          curl -sSfL -o actionlint.tgz "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
      - name: actionlint
        run: ./actionlint -color
      - name: zizmor
        run: |
          python -m pip install --upgrade pip "zizmor==1.30.1"
          zizmor --offline --config .github/zizmor.yml .github/workflows

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: pip-audit the app lock
        run: |
          python -m pip install --upgrade pip "pip-audit==2.10.1"
          pip-audit -r requirements.lock --strict
      - name: pip-audit the billing service pins (Render deploys them)
        if: always()
        run: pip-audit -r billing_service/requirements.txt --strict
