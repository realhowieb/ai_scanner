name: Realtime Alerts

# P1-56: one real-time price-alert pass (scripts/realtime_alerts_once.py),
# dispatched every 5 minutes on main by cron-job.org during extended hours
# (*/5 8-23 * * 1-5 UTC). Same pattern as the BTC 15m logger. The script exits
# quietly outside 4:00-20:00 ET and on market holidays. The Render worker and
# the scheduled scans share user_alerts.last_fired_at, so no alert is sent twice.
# No GitHub `schedule:` trigger: GitHub's cron runs late and in bursts.
on:
  workflow_dispatch:

concurrency:
  group: realtime-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        # The worker only needs psycopg2 + httpx (pinned in billing_service/requirements.txt).
        run: python -m pip install --quiet --prefer-binary "psycopg2-binary==2.9.10" "httpx==0.28.1"
      - name: Check price alerts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          ALERT_THROTTLE_HOURS: "12"
        run: python scripts/realtime_alerts_once.py
