name: Signal Effectiveness Analysis

# Run 55 — read-only research evidence & signal effectiveness analysis against the
# live production store (Neon). READ-ONLY: never writes observations, outcomes,
# scans, or scanners, and never changes scoring/ranking/tiers. Manual only
# (workflow_dispatch). Uploads the JSON/Markdown report plus the exact input
# snapshot so the verdict can be replayed offline:
#   python -m scripts.db_traffic_job scripts.analyze_signal_effectiveness --input run55_input_snapshot.json

on:
  workflow_dispatch:

concurrency:
  group: signal-effectiveness
  cancel-in-progress: false

env:
  DB_TRAFFIC_WARN_BYTES: ${{ vars.DB_TRAFFIC_WARN_BYTES || '100000000' }}
  DB_TRAFFIC_WARN_UPLOAD_BYTES: ${{ vars.DB_TRAFFIC_WARN_UPLOAD_BYTES || '100000000' }}
  DB_TRAFFIC_WARN_CALLS: ${{ vars.DB_TRAFFIC_WARN_CALLS || '10000' }}
  DB_QUERY_WARN_MS: ${{ vars.DB_QUERY_WARN_MS || '2000' }}
  DB_JOB_WARN_MS: ${{ vars.DB_JOB_WARN_MS || '900000' }}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-core.txt -c requirements.lock
          python -m pip install --prefer-binary -r requirements-ml.txt -c requirements.lock
      - name: Analyze signal effectiveness (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m scripts.db_traffic_job scripts.analyze_signal_effectiveness --out artifacts/research --snapshot
          cat artifacts/research/run55_signal_effectiveness.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signal-effectiveness
          path: artifacts/research/
          if-no-files-found: warn

      - name: Upload aggregate database traffic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db-traffic-${{ github.job }}
          path: artifacts/db_traffic/*.json
          retention-days: 14
          if-no-files-found: ignore
