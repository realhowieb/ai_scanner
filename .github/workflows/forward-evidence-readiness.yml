name: Forward Evidence Readiness

# Run 56 — READ-ONLY forward-evidence readiness monitor. Answers "do we have
# enough trustworthy forward production evidence to rerun Run 55?" using evidence
# quantity/quality only; it never computes or publishes effectiveness statistics
# (anti-peeking). It writes nothing to the store, changes no scanner/scoring, and
# does NOT trigger Run 55: when ready it only surfaces RUN55_RERUN_RECOMMENDED=true.
#
# Runs once per trading day after the final Mature Observations cycle (its cron
# ends 22:30 UTC), plus manual dispatch. The GitHub schedule can start hours
# late (P2-69); a cron-job.org dispatch at 23:15 UTC can be added alongside it,
# and the concurrency group keeps the two from overlapping.

on:
  workflow_dispatch:
  schedule:
    - cron: "15 23 * * 1-5"

env:
  DB_TRAFFIC_WARN_BYTES: ${{ vars.DB_TRAFFIC_WARN_BYTES || '100000000' }}
  DB_TRAFFIC_WARN_UPLOAD_BYTES: ${{ vars.DB_TRAFFIC_WARN_UPLOAD_BYTES || '100000000' }}
  DB_TRAFFIC_WARN_CALLS: ${{ vars.DB_TRAFFIC_WARN_CALLS || '10000' }}
  DB_QUERY_WARN_MS: ${{ vars.DB_QUERY_WARN_MS || '2000' }}
  DB_JOB_WARN_MS: ${{ vars.DB_JOB_WARN_MS || '900000' }}

permissions:
  contents: read
  actions: read

concurrency:
  group: forward-evidence-readiness
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      RUN55_RERUN_RECOMMENDED: ${{ steps.monitor.outputs.RUN55_RERUN_RECOMMENDED }}
      state: ${{ steps.monitor.outputs.state }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-core.txt -c requirements.lock
      - name: Fetch latest non-dry-run maturation report (optional, run-level RATE_LIMITED)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # Maturation is dispatched by cron-job.org (workflow_dispatch), so take the
        # newest successful run of either kind whose report is not a dry run.
        run: |
          for RID in $(gh run list --workflow mature-observations.yml --status success -L 10 --json databaseId -q '.[].databaseId'); do
            rm -rf artifacts/maturation
            gh run download "$RID" -n maturation-report -D artifacts/maturation || continue
            if [ "$(jq -r '.dry_run // false' artifacts/maturation/maturation_report.json 2>/dev/null)" = "false" ]; then
              echo "maturation report from run $RID"
              exit 0
            fi
          done
          rm -rf artifacts/maturation  # none found: never pass on a dry-run report
      - name: Forward evidence readiness (read-only)
        id: monitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m scripts.db_traffic_job scripts.forward_evidence_readiness --out artifacts/research \
            --maturation-report artifacts/maturation/maturation_report.json
          cat artifacts/research/forward_evidence_readiness.md >> "$GITHUB_STEP_SUMMARY"
      - name: Research metadata completeness audit (Run 57, read-only)
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m scripts.db_traffic_job scripts.audit_research_metadata --out artifacts/research
          cat artifacts/research/research_metadata_audit.md >> "$GITHUB_STEP_SUMMARY"
      - name: Surface rerun recommendation (no automatic action)
        if: steps.monitor.outputs.RUN55_RERUN_RECOMMENDED == 'true'
        run: |
          echo "::notice title=RUN55_RERUN_RECOMMENDED=true::Forward evidence gates pass. Run 55 may be rerun manually (Signal Effectiveness Analysis). No action taken."
          echo "## ✅ RUN55_RERUN_RECOMMENDED=true — rerun Run 55 manually; nothing was triggered." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forward-evidence-readiness
          path: |
            artifacts/research/forward_evidence_readiness.json
            artifacts/research/forward_evidence_readiness.md
            artifacts/research/research_metadata_audit.json
            artifacts/research/research_metadata_audit.md
          if-no-files-found: warn

      - name: Upload aggregate database traffic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db-traffic-${{ github.job }}
          path: artifacts/db_traffic/*.json
          retention-days: 14
          if-no-files-found: ignore
