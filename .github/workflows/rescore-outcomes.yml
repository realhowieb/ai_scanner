name: Re-score Outcomes

# Manual-only. Re-scores opportunity outcomes that the outcome cron wrote empty
# before their 5-day window had closed (PREMATURE_LABEL_WRITE, see
# scripts/rescore_premature_outcomes.py and analytics/ml_readiness.py).
# Dry run by default; mode=apply writes signal_outcomes labels and the SPY
# benchmark, only for rows whose 1/3/5-day returns are all still NULL (never
# overwrites a real label). Features, scans and models are never touched.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run counts only; apply writes labels (production write, owner's go only)"
        type: choice
        options: [dry-run, apply]
        default: dry-run

concurrency:
  group: rescore-outcomes
  cancel-in-progress: false

env:
  DB_TRAFFIC_WARN_BYTES: ${{ vars.DB_TRAFFIC_WARN_BYTES || '100000000' }}
  DB_TRAFFIC_WARN_UPLOAD_BYTES: ${{ vars.DB_TRAFFIC_WARN_UPLOAD_BYTES || '100000000' }}
  DB_TRAFFIC_WARN_CALLS: ${{ vars.DB_TRAFFIC_WARN_CALLS || '10000' }}
  DB_QUERY_WARN_MS: ${{ vars.DB_QUERY_WARN_MS || '2000' }}
  DB_JOB_WARN_MS: ${{ vars.DB_JOB_WARN_MS || '900000' }}

permissions:
  contents: read

jobs:
  rescore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-core.txt -c requirements.lock
      - name: Re-score premature outcomes (${{ inputs.mode }})
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_SCANNER_SQLITE_FALLBACK: "false"
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "apply" ]; then
            python -m scripts.db_traffic_job scripts.rescore_premature_outcomes --apply
          else
            python -m scripts.db_traffic_job scripts.rescore_premature_outcomes
          fi

      - name: Upload aggregate database traffic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db-traffic-${{ github.job }}
          path: artifacts/db_traffic/*.json
          retention-days: 14
          if-no-files-found: ignore
