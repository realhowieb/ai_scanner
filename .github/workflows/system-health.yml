name: System Health

# Run 59 — HSF autonomous research & operations health control plane.
# READ-ONLY with respect to the experiment: builds one health model from existing
# telemetry, uploads system_health.{json,md}, and appends one snapshot to the
# separate operational table hsf_system_health (for the Streamlit view and trend
# comparison). No self-healing, no effectiveness statistics (anti-peeking).
#
# Cadence: after the final scan + maturation cycles of each trading day, plus a
# midday check. Weekend/holiday runs are harmless (the model is calendar-aware).

on:
  workflow_dispatch:
  # No GitHub `schedule:` trigger (removed 2026-10-02). cron-job.org dispatches
  # this workflow on main at 17:05 UTC (after the midday scan) and 23:45 UTC
  # (after the last maturation and the readiness monitor), Mon-Fri. GitHub's
  # cron ran these 3-4 hours late.

env:
  DB_TRAFFIC_WARN_BYTES: ${{ vars.DB_TRAFFIC_WARN_BYTES || '100000000' }}
  DB_TRAFFIC_WARN_UPLOAD_BYTES: ${{ vars.DB_TRAFFIC_WARN_UPLOAD_BYTES || '100000000' }}
  DB_TRAFFIC_WARN_CALLS: ${{ vars.DB_TRAFFIC_WARN_CALLS || '10000' }}
  DB_QUERY_WARN_MS: ${{ vars.DB_QUERY_WARN_MS || '2000' }}
  DB_JOB_WARN_MS: ${{ vars.DB_JOB_WARN_MS || '900000' }}

permissions:
  contents: read
  actions: read

concurrency:
  group: system-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements-core.txt -c requirements.lock
      - name: System health (read-only)
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
          ALPACA_FEED: ${{ secrets.ALPACA_FEED }}
        run: |
          python -m scripts.db_traffic_job scripts.system_health --out artifacts/health --persist
          cat artifacts/health/system_health.md >> "$GITHUB_STEP_SUMMARY"
      - name: ML v4 data readiness monitor (read-only)
        # Slim reads of the opportunity dataset; alerts print as warnings and
        # never fail the health run. See scripts/ml_readiness.py.
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AI_SCANNER_SQLITE_FALLBACK: "false"
        run: |
          python -m scripts.db_traffic_job scripts.ml_readiness --monitor --out artifacts/health
          cat artifacts/health/ml_readiness_monitor.md >> "$GITHUB_STEP_SUMMARY"
      - name: Surface human action (no automatic action)
        if: steps.health.outputs.human_action == 'HUMAN_ACTION_REQUIRED'
        run: echo "::warning title=HSF needs attention::System health reports HUMAN_ACTION_REQUIRED — see the step summary."
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: system-health
          path: |
            artifacts/health/system_health.json
            artifacts/health/system_health.md
            artifacts/health/ml_readiness_monitor.json
            artifacts/health/ml_readiness_monitor.md
          if-no-files-found: warn

      - name: Upload aggregate database traffic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db-traffic-${{ github.job }}
          path: artifacts/db_traffic/*.json
          retention-days: 14
          if-no-files-found: ignore
