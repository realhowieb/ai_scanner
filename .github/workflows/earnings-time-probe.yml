name: Earnings time probe (temporary)
on:
  push:
    branches: [claude/earnings-time-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Print raw provider rows for this week's big reporters
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          WANT = {"JPM","WFC","C","UNH","JNJ","GS","DPZ","BAC","MS","BLK","SCHW","PNC","TRV","USB"}
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "hsf-probe"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())
          f, t = "2026-10-12", "2026-10-18"
          fh = get("https://finnhub.io/api/v1/calendar/earnings?" + urllib.parse.urlencode({"from": f, "to": t, "token": os.environ["FINNHUB_API_KEY"]}))
          for r in fh.get("earningsCalendar", []):
              if r.get("symbol") in WANT:
                  print("FINNHUB", r.get("symbol"), r.get("date"), repr(r.get("hour")))
          for extra in ({}, {"includeReportTimes": "true"}):
              try:
                  rows = get("https://financialmodelingprep.com/stable/earnings-calendar?" + urllib.parse.urlencode({"from": f, "to": t, "apikey": os.environ["FMP_API_KEY"], **extra}))
              except Exception as e:
                  print("FMP", extra, "ERR", type(e).__name__, e); continue
              print("FMP", extra, "rows", len(rows), "keys", sorted(rows[0].keys()) if rows else None)
              for r in rows:
                  if r.get("symbol") in WANT:
                      print("FMP", extra, r.get("symbol"), r.get("date"), {k: v for k, v in r.items() if "time" in k.lower() or "hour" in k.lower() or "confirm" in k.lower() or "window" in k.lower()})
          PY
