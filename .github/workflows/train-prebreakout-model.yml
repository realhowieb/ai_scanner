name: Train PreBreakout Model - Run #12

on:
  workflow_dispatch:
    inputs:
      days_back:
        description: "Training lookback days"
        required: true
        default: "90"
      artifact_name:
        description: "Optional debug artifact name for the local .pkl"
        required: true
        default: "prebreakout-model-debug"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt
            requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r requirements.txt
          python -m pip install --prefer-binary -r requirements-ml.txt -c requirements.lock

      - name: Check required secrets
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL or DATABASE_URL GitHub Actions secret is required."
            exit 1
          fi
          if [ -z "$ALPACA_API_KEY_ID" ] || [ -z "$ALPACA_API_SECRET_KEY" ]; then
            echo "ALPACA_API_KEY_ID and ALPACA_API_SECRET_KEY GitHub Actions secrets are required."
            exit 1
          fi

      - name: Train and save PreBreakout model
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
          AI_SCANNER_SQLITE_FALLBACK: "false"
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          ALPACA_DATA_URL: ${{ secrets.ALPACA_DATA_URL }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from ml_prebreakout import MODEL_PATH, train_prebreakout_model

          days_back = int("${{ inputs.days_back }}")
          model_path = Path(MODEL_PATH)
          bundle = train_prebreakout_model(days_back=days_back, model_path=str(model_path))
          if not bundle:
              print(json.dumps({"trained": False, "days_back": days_back}, indent=2, sort_keys=True))
              raise SystemExit("PreBreakout Run #12 training returned no report.")

          summary = {
              "auc": bundle.get("auc"),
              "baseline_comparison": bundle.get("baseline_comparison") or {},
              "benchmark_context_source": bundle.get("benchmark_context_source") or {},
              "calibration": bundle.get("calibration") or [],
              "eligible_rows": bundle.get("eligible_rows") or bundle.get("rows"),
              "feature_ablation": bundle.get("feature_ablation") or [],
              "feature_list": bundle.get("feature_list") or bundle.get("features") or [],
              "feature_names": bundle.get("feature_names") or bundle.get("features") or [],
              "fold_metrics": bundle.get("fold_metrics") or bundle.get("validation_folds") or [],
              "market_feature_names": bundle.get("market_feature_names") or [],
              "market_regime_result": bundle.get("market_regime_result"),
              "mean_auc": bundle.get("mean_auc"),
              "model_path": str(model_path),
              "model_version": bundle.get("model_version"),
              "positive_rows": bundle.get("positive_rows"),
              "purge_days": bundle.get("purge_days"),
              "promotion_reasons": bundle.get("promotion_reasons") or [],
              "promotion_result": bundle.get("promotion_result"),
              "rows": bundle.get("rows"),
              "run6_reproduction_audit": bundle.get("run6_reproduction_audit") or {},
              "run8_champion_auc": bundle.get("run8_champion_auc"),
              "run9_dataset_audit": bundle.get("run9_dataset_audit") or {},
              "run11_champion_auc": bundle.get("run11_champion_auc"),
              "run10_dataset_audit": bundle.get("run10_dataset_audit") or {},
              "run11_dataset_audit": bundle.get("run11_dataset_audit") or {},
              "run12_dataset_audit": bundle.get("run12_dataset_audit") or {},
              "run11_result": bundle.get("run11_result"),
              "run12_result": bundle.get("run12_result"),
              "selected_feature_set": bundle.get("selected_feature_set"),
              "source": bundle.get("source"),
              "std_auc": bundle.get("std_auc"),
              "target": bundle.get("target"),
              "target_rule": bundle.get("target_rule"),
              "trained_at": bundle.get("trained_at"),
              "training_rows": bundle.get("training_rows") or bundle.get("rows"),
              "validation_method": bundle.get("validation_method"),
              "validation_metrics": bundle.get("validation_metrics") or bundle.get("validation_summary") or {},
              "validation_rows": bundle.get("validation_rows"),
          }
          print(json.dumps(summary, indent=2, sort_keys=True, default=str))
          promoted = bundle.get("promotion_result") in {"PROMOTE", "STRONG_PROMOTION"}
          if promoted and bundle.get("source") != "database":
              raise SystemExit("PreBreakout model trained locally but was not saved to Neon.")
          if not promoted:
              print("PreBreakout Run #12 did not promote a new champion; Run #11 remains in Neon.")
          PY

      - name: Upload debug model artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            prebreakout_model.pkl
            prebreakout_run12_results.json
          if-no-files-found: warn
